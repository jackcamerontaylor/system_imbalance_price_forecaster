[project]
name = "sip-forecaster"
version = "0.1.0"
description = "Day-ahead GB System Imbalance Price (SIP) forecaster"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = ["ipykernel>=6", "matplotlib>=3.8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
